name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check .

      - name: Run tests
        run: deno test
